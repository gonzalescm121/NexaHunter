name: NexaHunter Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexahunter-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Validation Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify Node.js
        run: node --version
      - name: Verify npm
        run: npm --version
      - name: Install dependencies
        run: npm install
      - name: Syntax check
        run: npm run syntax
      - name: Run full NexaHunter tests
        run: npm test
      - name: Verify production files
        run: |
          test -f public/index.html
          test -f public/login.html
          test -f public/privacy.html
          test -f public/terms.html
          test -f public/disclaimer.html
          test -f public/support.html
          test -f public/styles.css
          test -f public/app.js
          test -f public/panels.js
          test -f public/realtime.js
          test -f public/crypto-experience.js
          test -f public/crypto-experience.css
          test -f worker-app.js
          test -f worker-entry.js
          test -f worker-idempotent-entry.js
          test -f worker.js
          test -f src/auth.js
          test -f src/core.js
          test -f src/portfolio.js
          test -f src/idempotency.js
          test -f src/market-stream.js
          test -f src/research.js
          test -f wrangler.toml
      - name: Verify deployment configuration
        run: |
          grep -Eq '^main = "(worker-entry|worker-idempotent-entry)\.js"' wrangler.toml
          grep -q '^directory = "./public"' wrangler.toml
          grep -q '^binding = "ASSETS"' wrangler.toml
          grep -q 'name = "RATE_LIMITER"' wrangler.toml
          grep -q 'name = "PORTFOLIO"' wrangler.toml
          grep -q 'name = "MARKET_STREAM"' wrangler.toml
          grep -q 'name = "IDEMPOTENCY"' wrangler.toml
          grep -q 'new_sqlite_classes = \["IdempotencyDurableObject"\]' wrangler.toml
          grep -q 'new_sqlite_classes = \["PortfolioDurableObject"\]' wrangler.toml
          grep -q 'new_sqlite_classes = \["MarketStreamDurableObject"\]' wrangler.toml
      - name: Verify authentication boundary
        run: |
          grep -q 'oauth/cloudflare/login' worker-entry.js
          grep -q 'oauth/cloudflare/callback' worker-entry.js
          grep -q 'CLOUDFLARE_OAUTH_CLIENT_ID' worker-entry.js
          grep -q 'SESSION_SECRET' worker-entry.js
          grep -q 'ctx?.access' worker-entry.js
          grep -q 'getIdentity' worker-entry.js
          grep -q 'S256' src/auth.js
          grep -q 'HttpOnly' src/auth.js
          grep -q 'Secure' src/auth.js
          grep -q 'SameSite=Lax' src/auth.js
          grep -q 'paper:' worker-entry.js
      - name: Verify paper-only runtime boundary
        run: |
          grep -q "mode:'PAPER'" worker-app.js
          grep -q "liveExecution:false" worker-app.js
          grep -q "mode: 'PAPER'" src/portfolio.js
          grep -q "liveExecution: false" src/portfolio.js
          grep -q "'FILLED_PAPER'" src/portfolio.js
          ! grep -q "live-orders" worker-app.js
          ! grep -q "/api/live-orders" public/panels.js
          grep -q "ALPACA_API_KEY" worker-app.js
          grep -q "ALPACA_API_SECRET" worker-app.js
