name: NexaHunter Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexahunter-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Validation Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify Node.js
        run: node --version
      - name: Verify npm
        run: npm --version
      - name: Install dependencies
        run: npm install
      - name: Syntax check
        run: npm run syntax
      - name: Run full NexaHunter tests
        run: npm test
      - name: Verify production files
        run: |
          test -f public/index.html
          test -f public/styles.css
          test -f public/app.js
          test -f public/panels.js
          test -f public/realtime.js
          test -f worker-app.js
          test -f worker.js
          test -f src/core.js
          test -f src/portfolio.js
          test -f src/idempotency.js
          test -f src/market-stream.js
          test -f wrangler.toml
      - name: Verify deployment configuration
        run: |
          grep -q '^main = "worker-app.js"' wrangler.toml
          grep -q '^directory = "./public"' wrangler.toml
          grep -q 'name = "ASSETS"' wrangler.toml
          grep -q 'name = "PORTFOLIO"' wrangler.toml
          grep -q 'name = "MARKET_STREAM"' wrangler.toml
          grep -q 'name = "IDEMPOTENCY"' wrangler.toml
          grep -q 'new_sqlite_classes = \["IdempotencyDurableObject"\]' wrangler.toml
          grep -q 'new_sqlite_classes = \["PortfolioDurableObject"\]' wrangler.toml
          grep -q 'new_sqlite_classes = \["MarketStreamDurableObject"\]' wrangler.toml
      - name: Verify paper-only runtime boundary
        run: |
          grep -q "mode:'paper'" worker-app.js
          grep -q "liveExecution:false" worker-app.js
          grep -q "ALPACA_API_KEY" worker-app.js
          grep -q "ALPACA_API_SECRET" worker-app.js
