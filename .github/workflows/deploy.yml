name: NexaHunter Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to confirm production deployment
        required: true
        default: DEPLOY

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Validate before deployment
        run: npm run syntax && npm test
      - name: Deploy Worker and Assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.126.0 deploy
      - name: Production smoke test
        env:
          PUBLIC_ORIGIN: ${{ secrets.NEXAHUNTER_PUBLIC_ORIGIN }}
          WORKER_ORIGIN: https://nexahunter.gonzalescm121.workers.dev
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$PUBLIC_ORIGIN"

          # The custom domain is protected by Cloudflare Access. Without a service
          # token, protected pages may legitimately return 403 or a redirect before
          # an interactive Access session exists. Validate that boundary explicitly.
          for protected_path in / /login; do
            protected_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$PUBLIC_ORIGIN$protected_path")"
            case "$protected_status" in
              200|302|403) ;;
              *) echo "Unexpected protected status for $protected_path: $protected_status"; exit 1 ;;
            esac
          done

          health="$(curl --fail --silent --show-error "$WORKER_ORIGIN/health")"
          printf '%s' "$health" | grep -q '"status":"ok"'
          printf '%s' "$health" | grep -q '"marketDataConfigured":true'
          printf '%s' "$health" | grep -q '"liveExecution":false'

          snapshot="$(curl --fail --silent --show-error "$WORKER_ORIGIN/api/market/snapshot?symbols=AAPL&crypto=BTC%2FUSD")"
          printf '%s' "$snapshot" | grep -q '"stocks"'
          printf '%s' "$snapshot" | grep -q '"AAPL"'
          printf '%s' "$snapshot" | grep -q '"crypto"'

          bars="$(curl --fail --silent --show-error "$WORKER_ORIGIN/api/market/bars?symbol=AAPL&timeframe=1Min&limit=5")"
          printf '%s' "$bars" | grep -q '"symbol":"AAPL"'
          printf '%s' "$bars" | grep -q '"bars"'

          stream_config="$(curl --fail --silent --show-error "$WORKER_ORIGIN/api/market/stream-config")"
          printf '%s' "$stream_config" | grep -q '"enabled":true'
          printf '%s' "$stream_config" | grep -q 'wss://stream.data.alpaca.markets/v2/iex'

          node <<'NODE'
          const url = 'wss://nexahunter.gonzalescm121.workers.dev/api/market/stream';
          const ws = new WebSocket(url);
          const timer = setTimeout(() => { try { ws.close(); } catch {} process.exit(1); }, 10000);
          ws.addEventListener('open', () => {
            ws.send(JSON.stringify({ action: 'subscribe', symbols: ['AAPL'] }));
          });
          ws.addEventListener('message', (event) => {
            const text = String(event.data);
            if (text.includes('AAPL') || text.includes('connected') || text.includes('trade') || text.includes('quote') || text.includes('bar')) {
              clearTimeout(timer);
              ws.close();
              process.exit(0);
            }
          });
          ws.addEventListener('error', () => { clearTimeout(timer); process.exit(1); });
          ws.addEventListener('close', () => { clearTimeout(timer); process.exit(1); });
          NODE

          echo 'Production market API and WebSocket smoke tests passed.'
