name: NexaHunter Deploy
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to confirm production deployment
        required: true
        default: DEPLOY
permissions:
  contents: read
jobs:
  deploy:
    if: ${{ github.event.inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install
      - run: npm run syntax && npm test
      - name: Deploy Worker and Assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.126.0 deploy
      - name: Production smoke test
        env:
          PUBLIC_ORIGIN: ${{ secrets.NEXAHUNTER_PUBLIC_ORIGIN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$PUBLIC_ORIGIN"
          access_headers=()
          if [[ -n "$CF_ACCESS_CLIENT_ID" && -n "$CF_ACCESS_CLIENT_SECRET" ]]; then
            access_headers=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          fi
          for path in / /login; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' "${access_headers[@]}" "$PUBLIC_ORIGIN$path" || true)"
            case "$status" in 200|301|302|307|308|401|403) ;; *) exit 1;; esac
          done
          smoke_origin="https://nexahunter.gonzalescm121.workers.dev"
          [[ -n "$CF_ACCESS_CLIENT_ID" && -n "$CF_ACCESS_CLIENT_SECRET" ]] || smoke_origin="$PUBLIC_ORIGIN"
          get() { local out; out="$(mktemp)"; status="$(curl --silent --show-error --output "$out" --write-out '%{http_code}' --connect-timeout 10 --max-time 30 "${access_headers[@]}" "$1" || true)"; [[ "$status" == 2* ]] || { head -c 2048 "$out" >&2; exit 22; }; cat "$out"; rm -f "$out"; }
          health="$(get "$smoke_origin/health")"
          printf '%s' "$health" | grep -q '"status":"ok"'
          printf '%s' "$health" | grep -q '"marketDataConfigured":true'
          printf '%s' "$health" | grep -q '"liveExecution":false'
          snapshot="$(get "$smoke_origin/api/market/snapshot?symbols=AAPL&crypto=BTC%2FUSD")"
          printf '%s' "$snapshot" | grep -q '"stocks"'
          printf '%s' "$snapshot" | grep -q '"AAPL"'
          printf '%s' "$snapshot" | grep -q '"crypto"'
          bars="$(get "$smoke_origin/api/market/bars?symbol=AAPL&timeframe=1Min&limit=5")"
          printf '%s' "$bars" | grep -q '"symbol":"AAPL"'
          printf '%s' "$bars" | grep -q '"bars"'
          stream="$(get "$smoke_origin/api/market/stream-config")"
          printf '%s' "$stream" | grep -q '"enabled":true'
          printf '%s' "$stream" | grep -q 'wss://stream.data.alpaca.markets/v2/iex'
          ws="$(curl --silent --output /dev/null --write-out '%{http_code}' "${access_headers[@]}" -H 'Connection: Upgrade' -H 'Upgrade: websocket' -H 'Sec-WebSocket-Version: 13' -H 'Sec-WebSocket-Key: SGVsbG9Xb3JsZDEyMzQ1Ng==' "$smoke_origin/api/market/stream" || true)"
          test "$ws" = 101
          echo 'Production market API and WebSocket smoke tests passed.'
