name: NexaHunter Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to confirm production deployment
        required: true
        default: DEPLOY

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Validate before deployment
        run: npm run syntax && npm test
      - name: Deploy Worker and Assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.126.0 deploy
      - name: Production smoke test
        env:
          PUBLIC_ORIGIN: ${{ secrets.NEXAHUNTER_PUBLIC_ORIGIN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$PUBLIC_ORIGIN"
          test -n "$CF_ACCESS_CLIENT_ID"
          test -n "$CF_ACCESS_CLIENT_SECRET"

          # The custom domain is protected by Cloudflare Access. Without a service
          # token, protected pages may legitimately return 403 or a redirect before
          # an interactive Access session exists. Validate that boundary explicitly.
          for protected_path in / /login; do
            protected_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$PUBLIC_ORIGIN$protected_path")"
            case "$protected_status" in
              200|302|403) ;;
              *) echo "Unexpected protected status for $protected_path: $protected_status"; exit 1 ;;
            esac
          done

          access_headers=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")

          # Keep failures strict, but expose the exact protected endpoint and status
          # so a Cloudflare Access rejection cannot be misdiagnosed as an application
          # failure. The request still fails hard on every non-2xx response.
          smoke_get() {
            local label="$1"
            local url="$2"
            local body_file status
            body_file="$(mktemp)"
            status="$(curl --silent --show-error --output "$body_file" --write-out '%{http_code}' "${access_headers[@]}" "$url")"
            if [[ "$status" != 2* ]]; then
              echo "Production smoke test failed: ${label} returned HTTP ${status}"
              echo "Endpoint: ${url}"
              echo "Response body (first 2KB):"
              head -c 2048 "$body_file" || true
              echo
              rm -f "$body_file"
              return 22
            fi
            cat "$body_file"
            rm -f "$body_file"
          }

          health="$(smoke_get 'health' "$PUBLIC_ORIGIN/health")"
          printf '%s' "$health" | grep -q '"status":"ok"'
          printf '%s' "$health" | grep -q '"marketDataConfigured":true'
          printf '%s' "$health" | grep -q '"liveExecution":false'

          snapshot="$(smoke_get 'market snapshot' "$PUBLIC_ORIGIN/api/market/snapshot?symbols=AAPL&crypto=BTC%2FUSD")"
          printf '%s' "$snapshot" | grep -q '"stocks"'
          printf '%s' "$snapshot" | grep -q '"AAPL"'
          printf '%s' "$snapshot" | grep -q '"crypto"'

          bars="$(smoke_get 'market bars' "$PUBLIC_ORIGIN/api/market/bars?symbol=AAPL&timeframe=1Min&limit=5")"
          printf '%s' "$bars" | grep -q '"symbol":"AAPL"'
          printf '%s' "$bars" | grep -q '"bars"'

          stream_config="$(smoke_get 'stream configuration' "$PUBLIC_ORIGIN/api/market/stream-config")"
          printf '%s' "$stream_config" | grep -q '"enabled":true'
          printf '%s' "$stream_config" | grep -q 'wss://stream.data.alpaca.markets/v2/iex'

          # Validate the production WebSocket bridge at the HTTP upgrade boundary.
          # The authenticated service-token headers are sent with the handshake;
          # application-level stream behavior remains covered by the dedicated
          # Worker/WebSocket contract tests in the full suite.
          ws_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            "${access_headers[@]}" \
            -H 'Connection: Upgrade' \
            -H 'Upgrade: websocket' \
            -H 'Sec-WebSocket-Version: 13' \
            -H 'Sec-WebSocket-Key: SGVsbG9Xb3JsZDEyMzQ1Ng==' \
            "$PUBLIC_ORIGIN/api/market/stream")"
          if [[ "$ws_status" != "101" ]]; then
            echo "Production smoke test failed: WebSocket upgrade returned HTTP ${ws_status}"
            echo "Endpoint: $PUBLIC_ORIGIN/api/market/stream"
            exit 1
          fi

          echo 'Production market API and WebSocket smoke tests passed.'
