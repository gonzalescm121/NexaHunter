name: NexaHunter Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to confirm production deployment
        required: true
        default: DEPLOY

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Validate before deployment
        run: npm run syntax && npm test
      - name: Deploy Worker and Assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.126.0 deploy
      - name: Production smoke test
        env:
          PUBLIC_ORIGIN: ${{ secrets.NEXAHUNTER_PUBLIC_ORIGIN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$PUBLIC_ORIGIN"

          access_headers=()
          if [[ -n "$CF_ACCESS_CLIENT_ID" && -n "$CF_ACCESS_CLIENT_SECRET" ]]; then
            access_headers=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
            echo 'Cloudflare Access service-token authentication enabled for smoke tests.'
          else
            echo 'No Cloudflare Access service token configured.'
          fi

          # Validate the configured public origin's edge boundary first. A
          # protected custom domain is allowed to return an Access response.
          for protected_path in / /login; do
            protected_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${access_headers[@]}" "$PUBLIC_ORIGIN$protected_path")"
            case "$protected_status" in
              200|302|401|403) ;;
              *) echo "Unexpected protected status for $protected_path: $protected_status"; exit 1 ;;
            esac
          done

          smoke_origin="$PUBLIC_ORIGIN"

          # If no Access service token is configured and the custom domain is
          # Access-protected, use the Worker deployment hostname for the strict
          # application smoke tests. This still exercises the exact deployed
          # Worker/version while preserving strict 2xx API checks. The custom
          # domain boundary was already validated above.
          if [[ -z "$CF_ACCESS_CLIENT_ID" || -z "$CF_ACCESS_CLIENT_SECRET" ]]; then
            health_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$PUBLIC_ORIGIN/health")"
            if [[ "$health_status" == "401" || "$health_status" == "403" ]]; then
              smoke_origin="https://nexahunter.gonzalescm121.workers.dev"
              echo "Custom origin is Access-protected without a service token; using deployed Worker hostname for API/WebSocket smoke tests."
            fi
          fi

          smoke_get() {
            local label="$1"
            local url="$2"
            local body_file status
            body_file="$(mktemp)"
            status="$(curl --silent --show-error --output "$body_file" --write-out '%{http_code}' "${access_headers[@]}" "$url")"
            if [[ "$status" != 2* ]]; then
              echo "Production smoke test failed: ${label} returned HTTP ${status}"
              echo "Endpoint: ${url}"
              echo "Response body (first 2KB):"
              head -c 2048 "$body_file" || true
              echo
              rm -f "$body_file"
              return 22
            fi
            cat "$body_file"
            rm -f "$body_file"
          }

          health="$(smoke_get 'health' "$smoke_origin/health")"
          printf '%s' "$health" | grep -q '"status":"ok"'
          printf '%s' "$health" | grep -q '"marketDataConfigured":true'
          printf '%s' "$health" | grep -q '"liveExecution":false'

          snapshot="$(smoke_get 'market snapshot' "$smoke_origin/api/market/snapshot?symbols=AAPL&crypto=BTC%2FUSD")"
          printf '%s' "$snapshot" | grep -q '"stocks"'
          printf '%s' "$snapshot" | grep -q '"AAPL"'
          printf '%s' "$snapshot" | grep -q '"crypto"'

          bars="$(smoke_get 'market bars' "$smoke_origin/api/market/bars?symbol=AAPL&timeframe=1Min&limit=5")"
          printf '%s' "$bars" | grep -q '"symbol":"AAPL"'
          printf '%s' "$bars" | grep -q '"bars"'

          stream_config="$(smoke_get 'stream configuration' "$smoke_origin/api/market/stream-config")"
          printf '%s' "$stream_config" | grep -q '"enabled":true'
          printf '%s' "$stream_config" | grep -q 'wss://stream.data.alpaca.markets/v2/iex'

          ws_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            "${access_headers[@]}" \
            -H 'Connection: Upgrade' \
            -H 'Upgrade: websocket' \
            -H 'Sec-WebSocket-Version: 13' \
            -H 'Sec-WebSocket-Key: SGVsbG9Xb3JsZDEyMzQ1Ng==' \
            "$smoke_origin/api/market/stream")"
          if [[ "$ws_status" != "101" ]]; then
            echo "Production smoke test failed: WebSocket upgrade returned HTTP ${ws_status}"
            echo "Endpoint: $smoke_origin/api/market/stream"
            exit 1
          fi

          echo 'Production market API and WebSocket smoke tests passed.'
