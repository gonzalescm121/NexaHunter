name: Enable fractional stock paper orders

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  enable-fractional-shares:
    if: ${{ !contains(github.event.head_commit.message, 'feat: enable fractional stock paper orders') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update validation and tests
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Expected text not found in {path}: {old!r}')
              p.write_text(s.replace(old, new, 1))

          worker = Path('worker.js')
          s = worker.read_text()
          s = s.replace('min="1" step="1"', 'min="0.000001" step="0.000001"', 1)
          s = s.replace('!Number.isInteger(\n      quantity\n    )', '!Number.isFinite(\n      quantity\n    )', 1)
          s = s.replace('Quantity must be a whole number', 'Quantity must be a positive number; fractional shares are supported', 1)
          worker.write_text(s)

          core = Path('src/core.js')
          s = core.read_text()
          old = '!Number.isInteger(\n      quantity\n    )'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one risk quantity integer check in src/core.js, found {count}')
          s = s.replace(old, '!Number.isFinite(\n      quantity\n    )', 1)
          old_exec = '!Number.isInteger(quantity)'
          count = s.count(old_exec)
          if count != 1:
              raise SystemExit(f'Expected exactly one execution quantity integer check in src/core.js, found {count}')
          s = s.replace(old_exec, '!Number.isFinite(quantity)', 1)
          core.write_text(s)

          # Convert the existing fractional-quantity rejection tests into acceptance tests.
          p = Path('tests/validation.test.js')
          s = p.read_text()
          pattern = r'test\("fractional quantity is rejected", async \(\) => \{.*?\n\}\);'
          replacement = '''test("fractional stock quantity is accepted", async () => {
  const response = await jsonRequest({
    symbol: "FRACSTOCK",
    quantity: 0.25,
    price: 100,
    side: "BUY"
  });

  assert.equal(response.status, 200);

  const data = await readJson(response);

  assert.equal(data.accepted, true);
  assert.equal(data.order.quantity, 0.25);
  assert.equal(data.order.mode, "PAPER");
  assert.equal(data.order.liveExecution, false);
});'''
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Fractional validation test was not found')
          p.write_text(s2)

          p = Path('tests/risk-regression.test.js')
          s = p.read_text()
          pattern = r'test\(\n  "fractional quantity fails closed",\n  \(\) => \{.*?\n\);'
          replacement = '''test(
  "fractional quantity is accepted by the risk engine",
  () => {
    const result =
      evaluateRisk(
        order({
          quantity: 1.5
        }),
        state(),
        {}
      );

    assert.equal(result.allowed, true);
    assert.equal(result.projectedPosition, 1.5);
  }
);'''
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Fractional risk regression test was not found')
          p.write_text(s2)

          p = Path('tests/type-boundary.test.js')
          s = p.read_text()
          pattern = r'test\("risk engine rejects fractional quantity", \(\) => \{.*?\n\}\);'
          replacement = '''test("risk engine accepts fractional quantity", () => {
  const result = evaluateRisk(
    { ...validOrder, quantity: 10.5 },
    validState,
    validLimits
  );

  assert.equal(result.allowed, true);
  assert.equal(result.projectedPosition, 10.5);
});'''
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Fractional risk type-boundary test was not found')
          s = s2

          pattern = r'test\("execution engine rejects fractional quantity", \(\) => \{.*?\n\}\);'
          replacement = '''test("execution engine accepts fractional quantity", () => {
  const result = estimateExecution(
    { ...validOrder, quantity: 1.5 },
    {}
  );

  assert.equal(result.valid, true);
  assert.equal(result.grossNotional, 150);
});'''
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Fractional execution type-boundary test was not found')
          p.write_text(s2)

          # Add a focused regression test so fractional stock support cannot regress.
          Path('tests/fractional-stock-paper.test.js').write_text('''import test from "node:test";\nimport assert from "node:assert/strict";\n\nimport worker from "../worker.js";\nimport { evaluateRisk, estimateExecution } from "../src/core.js";\n\nconst base = "https://nexahunter.test";\n\nasync function paperOrder(body) {\n  return worker.fetch(new Request(`${base}/api/paper-orders`, {\n    method: "POST",\n    headers: { "content-type": "application/json" },\n    body: JSON.stringify(body)\n  }));\n}\n\ntest("fractional stock paper BUY accepts a share amount below one", async () => {\n  const response = await paperOrder({\n    symbol: "FRACBUY",\n    quantity: 0.25,\n    price: 200,\n    side: "BUY"\n  });\n\n  assert.equal(response.status, 200);\n  const data = await response.json();\n  assert.equal(data.accepted, true);\n  assert.equal(data.order.quantity, 0.25);\n  assert.equal(data.order.mode, "PAPER");\n  assert.equal(data.order.liveExecution, false);\n});\n\ntest("fractional stock paper SELL is accepted by risk and execution layers", () => {\n  const risk = evaluateRisk(\n    { symbol: "FRACSELL", quantity: 0.125, price: 400, side: "SELL" },\n    { currentPosition: 1, dailyLoss: 0 },\n    { maxAbsolutePosition: 10 }\n  );\n  assert.equal(risk.allowed, true);\n  assert.equal(risk.projectedPosition, 0.875);\n\n  const execution = estimateExecution(\n    { symbol: "FRACSELL", quantity: 0.125, price: 400, side: "SELL" },\n    {}\n  );\n  assert.equal(execution.valid, true);\n  assert.equal(execution.grossNotional, 50);\n});\n''')

      - name: Run full test suite
        run: npm test

      - name: Commit fractional-share support and remove one-time workflow
        run: |
          rm -f .github/workflows/enable-fractional-stocks-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.js src/core.js tests .github/workflows/enable-fractional-stocks-once.yml
          git commit -m "feat: enable fractional stock paper orders"
          git push