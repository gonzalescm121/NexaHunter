name = "nexahunter"
main = "worker-idempotent-entry.js"
compatibility_date = "2026-08-24"

[assets]
directory = "./public"
binding = "ASSETS"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "741001"

[ratelimits.simple]
limit = 120
period = 60

[[durable_objects.bindings]]
name = "IDEMPOTENCY"
class_name = "IdempotencyDurableObject"

[[durable_objects.bindings]]
name = "PORTFOLIO"
class_name = "PortfolioDurableObject"

[[durable_objects.bindings]]
name = "MARKET_STREAM"
class_name = "MarketStreamDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["IdempotencyDurableObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PortfolioDurableObject"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["MarketStreamDurableObject"]
